<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Labs — Seguimiento</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: 0 0 0; --surface: 255 255 255; --border: 255 255 255;
    --text: 255 255 255; --text-muted: 163 163 173;
    --purple: 138 92 255; --blue: 62 130 250; --cyan: 34 211 238; --success: 74 222 128;
  }
  html.light { --bg: 250 250 251; --surface: 10 10 12; --border: 10 10 12; --text: 10 10 12; --text-muted: 90 90 100; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background: rgb(var(--bg)); color: rgb(var(--text)); font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; transition: background .4s ease, color .4s ease; }
  .font-display { font-family:'Satoshi','Inter',sans-serif; }
  .font-mono { font-family:'JetBrains Mono',monospace; }
  .card { max-width:720px; width:100%; border-radius:1.5rem; padding:2.5rem; background: rgb(var(--surface)/.05); border:1px solid rgb(var(--border)/.1); backdrop-filter: blur(20px); }
  .head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2.5rem; flex-wrap:wrap; gap:1rem; }
  .code { font-family:'JetBrains Mono',monospace; font-size:.75rem; color: rgb(var(--cyan)); margin-bottom:.4rem; }
  .device { font-family:'Satoshi',sans-serif; font-weight:900; font-size:1.4rem; }
  .meta { font-size:.8rem; color: rgb(var(--text-muted)); margin-top:.3rem; }

  .timeline { position:relative; padding: 0 .5rem; }
  .track { position:relative; height:3px; background: rgb(var(--surface)/.1); border-radius:2px; margin: 1.7rem 0; }
  .track-fill { position:absolute; top:0; left:0; height:100%; width:0%; border-radius:2px; background: linear-gradient(90deg, rgb(var(--purple)), rgb(var(--cyan))); transition: width 1.1s cubic-bezier(.2,.8,.2,1); }

  .steps { display:flex; justify-content:space-between; position:relative; margin-top:-2.6rem; }
  .step { display:flex; flex-direction:column; align-items:center; gap:.6rem; flex:1; text-align:center; }
  .node { width:16px; height:16px; border-radius:999px; background: rgb(var(--surface)/.15); border: 2px solid rgb(var(--border)/.2); position:relative; transition: all .4s ease; z-index:2; }
  .node.done { background: rgb(var(--cyan)); border-color: rgb(var(--cyan)); }
  .node.current { background: rgb(var(--cyan)); border-color: rgb(var(--cyan)); }
  .node.current::after { content:''; position:absolute; inset:-6px; border-radius:999px; border:1.5px solid rgb(var(--cyan)); animation: ring 1.8s cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes ring { 0%{ transform:scale(.7); opacity:.8; } 100%{ transform:scale(2); opacity:0; } }
  .step-label { font-family:'JetBrains Mono',monospace; font-size:.62rem; color: rgb(var(--text-muted)); max-width:70px; }
  .step.active .step-label { color: rgb(var(--text)); }

  .note { margin-top: 2.5rem; padding:1.25rem; border-radius:1rem; background: rgb(var(--cyan)/.06); border:1px solid rgb(var(--cyan)/.15); font-size:.85rem; color: rgb(var(--text-muted)); }

  .demo-controls { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:2rem; padding-top:1.5rem; border-top:1px solid rgb(var(--border)/.08); }
  .demo-btn { font-family:'JetBrains Mono',monospace; font-size:.68rem; padding:.4rem .8rem; border-radius:999px; background: rgb(var(--surface)/.06); color: rgb(var(--text-muted)); cursor:pointer; border:1px solid transparent; }
  .demo-btn.selected { color: rgb(var(--cyan)); border-color: rgb(var(--cyan)/.3); }

  @media (max-width: 560px) {
    .steps { flex-wrap: wrap; }
    .step-label { max-width: 50px; font-size:.58rem; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div>
      <p class="code">NL-2026-00045</p>
      <p class="device">MacBook Pro 14" — Laura Gómez</p>
      <p class="meta">Técnico asignado: Julián D. · Garantía: 3 meses tras entrega</p>
    </div>
  </div>

  <div class="timeline">
    <div class="track"><div class="track-fill" id="fill"></div></div>
    <div class="steps" id="steps"></div>
  </div>

  <div class="note" id="note"></div>

  <div class="demo-controls" id="controls"></div>
</div>

<script>
  const STATES = ["Recibido", "Diagnóstico", "Repuestos", "Reparación", "Pruebas", "Finalizado"];
  const NOTES = [
    "Tu equipo fue recibido y está en cola para diagnóstico.",
    "Un técnico está evaluando la causa del problema.",
    "Esperando la llegada de un repuesto verificado.",
    "El equipo está siendo intervenido en este momento.",
    "Verificando que todo funcione antes de la entrega.",
    "Listo para recoger. Garantía activa desde hoy.",
  ];

  const stepsEl = document.getElementById('steps');
  const fillEl = document.getElementById('fill');
  const noteEl = document.getElementById('note');
  const controlsEl = document.getElementById('controls');

  STATES.forEach((label) => {
    const step = document.createElement('div');
    step.className = 'step';
    step.innerHTML = `<div class="node"></div><span class="step-label">${label}</span>`;
    stepsEl.appendChild(step);
  });

  STATES.forEach((label, i) => {
    const btn = document.createElement('div');
    btn.className = 'demo-btn';
    btn.textContent = label;
    btn.addEventListener('click', () => setState(i));
    controlsEl.appendChild(btn);
  });

  function setState(currentIndex) {
    const nodes = stepsEl.querySelectorAll('.step');
    nodes.forEach((step, i) => {
      const node = step.querySelector('.node');
      node.classList.remove('done', 'current');
      step.classList.remove('active');
      if (i < currentIndex) node.classList.add('done');
      if (i === currentIndex) { node.classList.add('current'); step.classList.add('active'); }
    });
    const pct = (currentIndex / (STATES.length - 1)) * 100;
    fillEl.style.width = pct + '%';
    noteEl.textContent = NOTES[currentIndex];

    controlsEl.querySelectorAll('.demo-btn').forEach((b, i) => b.classList.toggle('selected', i === currentIndex));
  }

  setTimeout(() => setState(1), 300); // arranca en "Diagnóstico" como ejemplo
</script>
</body>
</html>
