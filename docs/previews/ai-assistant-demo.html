<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Labs — Asistente IA (demo funcional)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: 0 0 0; --surface: 255 255 255; --border: 255 255 255;
    --text: 255 255 255; --text-muted: 163 163 173;
    --purple: 138 92 255; --blue: 62 130 250; --cyan: 34 211 238;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background: rgb(var(--bg)); color: rgb(var(--text)); font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
  .font-display { font-family:'Satoshi','Inter',sans-serif; }
  .font-mono { font-family:'JetBrains Mono',monospace; }
  .card { width:100%; max-width:420px; height:600px; display:flex; flex-direction:column; border-radius:1.5rem; padding:1.5rem; background: rgb(var(--surface)/.05); border:1px solid rgb(var(--border)/.1); backdrop-filter: blur(20px); }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  .head-title { font-family:'Satoshi',sans-serif; font-weight:900; font-size:1rem; }
  .dot { width:7px; height:7px; border-radius:999px; background: rgb(var(--cyan)); box-shadow: 0 0 8px rgb(var(--cyan)); }
  .badge { font-family:'JetBrains Mono',monospace; font-size:.62rem; color: rgb(var(--text-muted)); display:flex; align-items:center; gap:.4rem; }

  .messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:.9rem; padding-right:.25rem; }
  .msg { font-size:.88rem; line-height:1.5; max-width:88%; padding:.7rem 1rem; border-radius:1rem; }
  .msg.assistant { background: rgb(var(--surface)/.06); border:1px solid rgb(var(--border)/.08); align-self:flex-start; border-bottom-left-radius:.3rem; }
  .msg.user { background: rgb(var(--cyan)/.15); color: rgb(var(--cyan)); align-self:flex-end; border-bottom-right-radius:.3rem; }
  .typing { font-family:'JetBrains Mono',monospace; font-size:.7rem; color: rgb(var(--text-muted)); align-self:flex-start; }

  .composer { margin-top:1rem; display:flex; gap:.5rem; }
  input { flex:1; background: rgb(var(--surface)/.06); border:1px solid rgb(var(--border)/.1); border-radius:.8rem; padding:.75rem 1rem; color: rgb(var(--text)); font-family:'Inter',sans-serif; font-size:.85rem; }
  input::placeholder { color: rgb(var(--text-muted)); }
  button { background: rgb(var(--cyan)/.18); color: rgb(var(--cyan)); border:none; border-radius:.8rem; padding:0 1.1rem; font-family:'Satoshi',sans-serif; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }

  .disclaimer { margin-top:.9rem; font-size:.68rem; color: rgb(var(--text-muted)); text-align:center; }
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <span class="head-title">Asistente Nexora</span>
    <span class="badge"><span class="dot"></span>Conectado a Claude</span>
  </div>

  <div class="messages" id="messages">
    <div class="msg assistant">Hola 👋 Cuéntame qué le pasa a tu equipo y te oriento. Para confirmar la causa siempre vas a necesitar un diagnóstico presencial.</div>
  </div>

  <div class="composer">
    <input id="input" type="text" placeholder="Ej: mi portátil no da imagen..." />
    <button id="send">Enviar</button>
  </div>
  <p class="disclaimer">Demo en vivo — usa el mismo system prompt del código de producción (app/api/ai-assistant/route.ts).</p>
</div>

<script>
  const SYSTEM_PROMPT = `Eres el asistente de orientación técnica de Nexora Labs, un laboratorio de reparación y desarrollo tecnológico en Bogotá.

Reglas estrictas que nunca rompes:
- NUNCA afirmas con certeza cuál es la falla de un equipo. Solo mencionas 2-3 causas posibles en términos generales.
- SIEMPRE terminas recomendando agendar un diagnóstico presencial — es la única forma de confirmar la causa real.
- No das cotizaciones, tiempos de reparación exactos, ni instrucciones para que el usuario abra o repare el equipo por su cuenta.
- Tono profesional, cercano, en español. Máximo 3-4 frases por respuesta.
- Si preguntan algo fuera de reparación/tecnología, rediriges amablemente al tema.`;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = [];

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    inputEl.value = '';
    sendBtn.disabled = true;

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = 'Escribiendo...';
    messagesEl.appendChild(typing);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 300,
          system: SYSTEM_PROMPT,
          messages: history,
        }),
      });
      const data = await response.json();
      const reply = (data.content || []).map(b => b.text || "").join("").trim() || "No pude generar una respuesta, intenta de nuevo.";

      typing.remove();
      addMessage('assistant', reply);
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      typing.remove();
      addMessage('assistant', 'Hubo un problema de conexión. Intenta de nuevo en un momento.');
    }

    sendBtn.disabled = false;
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
